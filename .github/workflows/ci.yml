name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Tools/CoreTests/FamilyRacing.CoreTests.csproj --configuration Release --logger "trx;LogFileName=core.trx" --results-directory TestResults
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: core-test-results
          path: TestResults
          if-no-files-found: ignore

  tooling:
    name: Release and tooling tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s Tools -p "Test*.py"
      - name: PowerShell tooling fixtures
        shell: powershell
        run: |
          foreach ($script in @('Test-VerifyTooling.ps1', 'Test-AndroidOffline.ps1', 'Test-FamilyReleaseTooling.ps1', 'Test-FamilyProfileBackup.ps1')) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path Tools $script)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
